[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avaz-trainer"
version = "0.1.0"
description = "Personal practice tool for Persian classical singing (avaz): live pitch in cents, teacher curve comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "sounddevice",
    "PySide6",
    "pyqtgraph",
    "PyYAML",
    "matplotlib",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
avaz = "avaz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
